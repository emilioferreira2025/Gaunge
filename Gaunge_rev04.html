<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

   <script>
    // ======================================================
    // INICIALIZA O GRÁFICO
    // ======================================================
    const chart = echarts.init(document.getElementById("chart"));

    // ======================================================
    // CONFIGURAÇÕES
    // ======================================================
    const MAX_SCALE = 60;   // escala máxima (A)
    let currentValue = 43.0; // valor de exemplo (altere livremente)

    // ======================================================
    // FUNÇÃO QUE MONTA O OPTION DO GAUGE
    // ======================================================
    function getOption(value) {
      return {
        series: [{
          type: "gauge",

          // 🔥 CONTROLE DEFINITIVO DAS MARGENS
          center: ["50%", "78%"], // elimina margem inferior
          radius: "100%",         // reduz margens laterais

          // FORMATO (MEIA LUA)
          startAngle: 180,
          endAngle: 0,

          // ESCALA (0–60 | 10 em 10)
          min: 0,
          max: MAX_SCALE,
          splitNumber: 6, // 0,10,20,30,40,50,60

          // ARCO DA ESCALA
          axisLine: {
            roundCap: true,
            lineStyle: {
              width: 18,
              color: [
                [0.71, "#fb8c00"],  // laranja
                [0.78, "#156E2F"],  // Verde
                [1.0, "#e53935"]   // vermelho
              ]
            }
          },

          // BARRA DE PROGRESSO
          progress: {
            show: false,
            roundCap: true,
            width: 18
          },

          // PONTEIRO (APROXIMADO)
          pointer: {
            length: "90%",
            width: 12,
            offsetCenter: [0, "-6%"],
            itemStyle: { color: "#FFFFFF" }
          },

          // MARCAS PEQUENAS
          axisTick: {
            distance: -22,
            length: 6,
            lineStyle: { color: "#FFFFFF", width: 2 }
          },

          // MARCAS GRANDES
          splitLine: {
            distance: -26,
            length: 16,
            lineStyle: { color: "#FFFFFF", width: 3 }
          },

          // NÚMEROS DA ESCALA (30 aparece)
          axisLabel: {
            distance: -24,
            fontSize: 14,
            color: "#FFFFFF",
            interval: 0 // força 0,10,20,30,40,50,60
          },

          // VALOR CENTRAL (≈ 16–20%)
          detail: {
            valueAnimation: true,
            fontSize: 34,
            fontWeight: "bold",
            color: "#FFFFFF",
            offsetCenter: [0, "8%"],
            formatter: v => v.toFixed(1) + " A"
          },

          title: { show: false },

          // VALOR ATUAL
          data: [{ value }]
        }]
      };
    }

    // =====================================================
    // SDK TAGOIO – CARGA INICIAL
    // =====================================================
    window.TagoIO.onStart(widget => {
      const data = widget.data
        .filter(d => d.variable === "current_ipp1")
        .sort((a, b) => new Date(b.time) - new Date(a.time));

      if (data.length) {
        render(Number(data[0].value));
      }
    });

    // =====================================================
    // SDK TAGOIO – TEMPO REAL
    // =====================================================
    window.TagoIO.onRealtime(buckets => {
      buckets.forEach(bucket => {
        if (!bucket.result) return;

        bucket.result.forEach(d => {
          if (d.variable === "current_ipp1") {
            render(Number(d.value));
          }
        });
      });
    });

    window.TagoIO.ready();

    // =====================================================
    // RESPONSIVIDADE TOTAL
    // =====================================================
    window.addEventListener("resize", () => {
      if (chart) chart.resize();
    });
  </script>
</body>
</html>
