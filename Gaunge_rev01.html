<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
    #chart {
      width: 100%;
      height: 350px;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

  <script>
    const chart = echarts.init(document.getElementById("chart"));

    const option = {
      series: [
        {
          type: "gauge",
          startAngle: 180,
          endAngle: 0,

          min: 0,
          max: 50,                 // 🔴 ESCALA ATÉ 50 A
          splitNumber: 5,          // 0,10,20,30,40,50

          axisLine: {
            lineStyle: {
              width: 18,
              color: [
                [0.6, "#ff0000"],   // até 30 A → vermelho
                [1, "#e6ebf5"]      // restante → cinza claro
              ]
            }
          },

          pointer: {
            length: "70%",
            width: 10,
            itemStyle: {
              color: "#ff0000"
            }
          },

          axisTick: {
            distance: -25,
            length: 6,
            lineStyle: {
              color: "#999",
              width: 1
            }
          },

          splitLine: {
            distance: -30,
            length: 12,
            lineStyle: {
              color: "#999",
              width: 2
            }
          },

          axisLabel: {
            distance: -45,
            color: "#999",
            fontSize: 12,
            formatter: function (value) {
              return value.toFixed(0);
            }
          },

          detail: {
            valueAnimation: true,
            fontSize: 32,
            fontWeight: "bold",
            color: "#444",
            offsetCenter: [0, "35%"],
            formatter: function (value) {
              return value.toFixed(1) + " A";
            }
          },

          title: {
            show: false
          },

          data: [
            {
              value: 47.4   // 🔹 valor de exemplo
            }
          ]
        }
      ]
    };

    chart.setOption(option);

    // 🔧 EXEMPLO: atualizar valor dinamicamente
    // chart.setOption({
    //   series: [{ data: [{ value: 32.8 }] }]
    // });
  </script>
</body>
</html>
