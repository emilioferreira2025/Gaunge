<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- ======================================================
       SDK OFICIAL DO CUSTOM WIDGET TAGOIO
       Necessário para:
       - onStart
       - onRealtime
       - widget.data
       ====================================================== -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- ======================================================
       APACHE ECHARTS
       Biblioteca usada para o Gauge
       ====================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    /* ======================================================
       ESTILO GLOBAL
       ====================================================== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ======================================================
       CONTAINER DO GAUGE (RESPONSIVO)
       ====================================================== */
    #chart {
      width: 100%;
      height: 100%;
      min-height: 250px;
    }
  </style>
</head>

<body>

  <!-- ======================================================
       ELEMENTO ONDE O GAUGE SERÁ RENDERIZADO
       ====================================================== -->
  <div id="chart"></div>

  <script>
    /* ======================================================
       VARIÁVEL GLOBAL DO GRÁFICO
       ====================================================== */
    let chart = null;

    /* ======================================================
       CONFIGURAÇÕES PRINCIPAIS
       ====================================================== */
    const VARIABLE_NAME = "current_ipp1"; // 🔴 Nome da variável no TagoIO
    const MAX_SCALE = 60;                 // 🔴 Escala máxima (A)

    /* ======================================================
       FUNÇÃO DE DESENHO / ATUALIZAÇÃO DO GAUGE
       ====================================================== */
    function renderGauge(value) {

      /* Inicializa o gráfico apenas uma vez */
      if (!chart) {
        chart = echarts.init(document.getElementById("chart"));
      }

      /* Proteção para não ultrapassar a escala */
      const safeValue = Math.min(value, MAX_SCALE);

      chart.setOption({
        series: [
          {
            type: "gauge",

            /* =============================================
               FORMATO DO GAUGE (MEIA LUA)
               ============================================= */
            startAngle: 180,
            endAngle: 0,

            /* =============================================
               ESCALA
               ============================================= */
            min: 0,
            max: MAX_SCALE,
            splitNumber: 6, // 0,10,20,30,40,50,60

            /* =============================================
               LINHA DA ESCALA (ARCO) → CORES PRINCIPAIS
               ============================================= */
            axisLine: {
              roundCap: true,
              lineStyle: {
                width: 18,

                /* 🔴 ALTERE AS CORES AQUI 🔴 */
                color: [
                  [0.7, "#4caf50"],  // 🟢 normal
                  [0.9, "#ff9800"],  // 🟡 alerta
                  [1.0, "#f44336"]   // 🔴 crítico
                ]
              }
            },

            /* =============================================
               BARRA DE PROGRESSO
               ============================================= */
            progress: {
              show: true,
              roundCap: true,
              width: 18,

              /* 🔴 Cor da barra (opcional) */
              itemStyle: {
                color: "#2196f3"
              }
            },

            /* =============================================
               PONTEIRO
               ============================================= */
            pointer: {
              length: "70%",
              width: 14,
              offsetCenter: [0, "5%"],

              /* 🔴 Cor do ponteiro */
              itemStyle: {
                color: "#f44336"
              }
            },

            /* =============================================
               MARCAS PEQUENAS
               ============================================= */
            axisTick: {
              distance: -30,
              length: 6,
              lineStyle: {
                color: "#999", // 🔴 cor das marcas pequenas
                width: 2
              }
            },

            /* =============================================
               MARCAS GRANDES
               ============================================= */
            splitLine: {
              distance: -34,
              length: 14,
              lineStyle: {
                color: "#999", // 🔴 cor das marcas grandes
                width: 3
              }
            },

            /* =============================================
               NÚMEROS DA ESCALA
               ============================================= */
            axisLabel: {
              distance: -48,
              fontSize: 14,

              /* 🔴 Cor dos números */
              color: "#777"
            },

            /* =============================================
               TEXTO CENTRAL (VALOR)
               ============================================= */
            detail: {
              valueAnimation: true,
              fontSize: 36,
              fontWeight: "bold",

              /* 🔴 Cor do valor */
              color: "#444",

              offsetCenter: [0, "38%"],
              formatter: val => val.toFixed(1) + " A"
            },

            title: { show: false },

            /* =============================================
               VALOR ATUAL
               ============================================= */
            data: [{ value: safeValue }]
          }
        ]
      });

      /* Ajuste automático de tamanho */
      chart.resize();
    }

    /* ======================================================
       PROCESSA OS DADOS DO TAGOIO
       ====================================================== */
    function processData(dataArray) {

      const filtered = dataArray
        .filter(d => d.variable === VARIABLE_NAME)
        .sort((a, b) => new Date(b.time) - new Date(a.time));

      if (!filtered.length) return;

      renderGauge(Number(filtered[0].value));
    }

    /* ======================================================
       EXECUTA AO ABRIR O WIDGET (DADOS HISTÓRICOS)
       ====================================================== */
    window.TagoIO.onStart(widget => {
      processData(widget.data);
    });

    /* ======================================================
       EXECUTA EM TEMPO REAL (DADOS NOVOS)
       ====================================================== */
    window.TagoIO.onRealtime(buckets => {
      let allData = [];

      buckets.forEach(bucket => {
        if (bucket.result) {
          allData = allData.concat(bucket.result);
        }
      });

      processData(allData);
    });

    /* ======================================================
       RESIZE OBRIGATÓRIO NO TAGOIO
       ====================================================== */
    window.addEventListener("resize", () => {
      if (chart) chart.resize();
    });

    /* ======================================================
       FINALIZA INICIALIZAÇÃO DO WIDGET
       ====================================================== */
    window.TagoIO.ready();
  </script>

</body>
</html>
