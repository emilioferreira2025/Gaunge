<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #chart {
      width: 100%;
      height: 100%;
      min-height: 220px;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

  <script>
    let chart = null;

    /* =====================================================
       OPTION DO GAUGE (ESCALA 10 EM 10)
       ===================================================== */
    const option = {
      tooltip: {
        formatter: '{a}<br/>{b} : {c}'
      },

      series: [
        {
          name: 'Pressure',
          type: 'gauge',

          /* Meia-lua */
          startAngle: 180,
          endAngle: 0,

          /* Escala 10 em 10 */
          min: 0,
          max: 100,          // 🔴 múltiplo de 10
          splitNumber: 10,   // 100 / 10

          axisLine: {
            roundCap: true,
            lineStyle: {
              width: '12%',
              color: [
                [0.7, '#4caf50'],
                [0.9, '#ff9800'],
                [1, '#f44336']
              ]
            }
          },

          progress: {
            show: true,
            roundCap: true,
            width: '12%'
          },

          pointer: {
            length: '70%',
            width: '6%'
          },

          axisTick: {
            splitNumber: 2,
            length: '4%'
          },

          splitLine: {
            length: '8%'
          },

          axisLabel: {
            distance: -30,
            fontSize: 14,

            // 🔑 garante 10 em 10
            interval: 10
          },

          detail: {
            valueAnimation: true,
            fontSize: '160%',
            fontWeight: 'bold',
            offsetCenter: [0, '35%'],
            formatter: '{value}'
          },

          data: [
            { value: 5, name: 'SCORE' }
          ]
        }
      ]
    };

    /* =====================================================
       INICIALIZAÇÃO DO WIDGET (SDK)
       ===================================================== */
    window.TagoIO.onStart(widget => {

      chart = echarts.init(document.getElementById('chart'));
      chart.setOption(option);

      // ajuste imediato após render
      chart.resize();
    });

    /* =====================================================
       ATUALIZAÇÃO EM TEMPO REAL (SDK)
       ===================================================== */
    window.TagoIO.onRealtime(buckets => {

      let latestValue = null;

      buckets.forEach(bucket => {
        if (bucket.result) {
          bucket.result.forEach(item => {
            if (item.variable === 'score') {
              latestValue = item.value;
            }
          });
        }
      });

      if (latestValue !== null && chart) {
        chart.setOption({
          series: [
            {
              data: [{ value: latestValue, name: 'SCORE' }]
            }
          ]
        });
      }
    });

    /* =====================================================
       RESIZE (OBRIGATÓRIO NO TAGOIO)
       ===================================================== */
    window.addEventListener('resize', () => {
      if (chart) chart.resize();
    });

    window.TagoIO.ready();
  </script>
</body>
</html>
