<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    /* ======================================================
       O widget ocupa 100% do espaço disponível
       ====================================================== */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ======================================================
       Container responsivo do Gauge
       ====================================================== */
    #chart {
      width: 100%;
      height: 100%;
      min-height: 240px;
    }
  </style>
</head>

<body>

  <!-- Container do gráfico -->
  <div id="chart"></div>

  <script>
    /* ======================================================
       VARIÁVEIS GERAIS
       ====================================================== */
    let chart = null;

    const VARIABLE_NAME = "current_ipp1"; // nome da tag no TagoIO
    const MAX_SCALE = 60;                 // escala máxima (deve ser múltiplo de 10)

    /* ======================================================
       FUNÇÃO QUE DESENHA / ATUALIZA O GAUGE
       ====================================================== */
    function renderGauge(value) {

      /* Inicializa apenas uma vez */
      if (!chart) {
        chart = echarts.init(document.getElementById("chart"));
      }

      /* Proteção contra estouro da escala */
      const safeValue = Math.min(value, MAX_SCALE);

      /* Quantidade de divisões (10 em 10) */
      const splitCount = MAX_SCALE / 10;

      chart.setOption({
        series: [{
          type: "gauge",

          /* Gauge em meia-lua */
          startAngle: 180,
          endAngle: 0,

          /* Escala */
          min: 0,
          max: MAX_SCALE,
          splitNumber: splitCount, // garante escala de 10 em 10

          /* Linha da escala */
          axisLine: {
            roundCap: true,
            lineStyle: {
              width: "12%",
              color: [
                [0.7, "#4caf50"],
                [0.9, "#ff9800"],
                [1, "#f44336"]
              ]
            }
          },

          /* Barra de progresso */
          progress: {
            show: true,
            roundCap: true,
            width: "12%"
          },

          /* Ponteiro */
          pointer: {
            length: "70%",
            width: "6%"
          },

          /* Marcas pequenas */
          axisTick: {
            distance: -18,
            length: "4%",
            lineStyle: { color: "#999" }
          },

          /* Marcas grandes (10 em 10) */
          splitLine: {
            distance: -22,
            length: "8%",
            lineStyle: { color: "#666" }
          },

          /* Números da escala */
          axisLabel: {
            distance: -36,
            fontSize: 14,
            color: "#666",

            /* 🔑 garante passo fixo de 10 */
            interval: 10
          },

          /* Valor central */
          detail: {
            valueAnimation: true,
            fontSize: "180%",
            fontWeight: "bold",
            color: "#333",
            offsetCenter: [0, "35%"],
            formatter: val => val.toFixed(1) + " A"
          },

          title: { show: false },

          /* Valor atual */
          data: [{ value: safeValue }]
        }]
      });

      /* Ajuste automático ao redimensionar */
      chart.resize();
    }

    /* ======================================================
       PROCESSA DADOS VINDOS DO TAGOIO
       ====================================================== */
    function processData(dataArray) {

      const filtered = dataArray
        .filter(d => d.variable === VARIABLE_NAME)
        .sort((a, b) => new Date(b.time) - new Date(a.time));

      if (!filtered.length) return;

      renderGauge(Number(filtered[0].value));
    }

    /* ======================================================
       CARGA INICIAL (HISTÓRICO)
       ====================================================== */
    window.TagoIO.onStart(widget => {
      processData(widget.data);
    });

    /* ======================================================
       ATUALIZAÇÃO EM TEMPO REAL
       ====================================================== */
    window.TagoIO.onRealtime(buckets => {
      let allData = [];

      buckets.forEach(bucket => {
        if (bucket.result) {
          allData = allData.concat(bucket.result);
        }
      });

      processData(allData);
    });

    /* ======================================================
       FINALIZA INICIALIZAÇÃO
       ====================================================== */
    window.TagoIO.ready();

    /* ======================================================
       REDIMENSIONAMENTO AUTOMÁTICO
       ====================================================== */
    window.addEventListener("resize", () => {
      if (chart) chart.resize();
    });
  </script>

</body>
</html>
