<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #chart {
      width: 100%;
      height: 100%;
      min-height: 250px;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

  <script>
    const chart = echarts.init(document.getElementById("chart"));

    const MAX_SCALE = 50;

    function updateGauge(realValue) {
      const gaugeValue = Math.min(realValue, MAX_SCALE);

      chart.setOption({
        series: [{
          type: "gauge",
          startAngle: 180,
          endAngle: 0,

          min: 0,
          max: MAX_SCALE,
          splitNumber: 5,

          axisLine: {
            roundCap: true,
            lineStyle: {
              width: 20,
              color: [
                [0.35, "#ff0000"],
                [1, "#e6ebf5"]
              ]
            }
          },

          pointer: {
            length: "70%",
            width: 14,
            offsetCenter: [0, "5%"],
            itemStyle: { color: "#ff0000" }
          },

          axisTick: {
            distance: -30,
            length: 6,
            lineStyle: { color: "#999" }
          },

          splitLine: {
            distance: -34,
            length: 14,
            lineStyle: { color: "#999" }
          },

          axisLabel: {
            distance: -48,
            color: "#777",
            fontSize: 12
          },

          detail: {
            valueAnimation: true,
            fontSize: 34,
            fontWeight: "bold",
            color: "#444",
            offsetCenter: [0, "38%"],
            formatter: () => realValue.toFixed(1) + " A"
          },

          title: { show: false },
          data: [{ value: gaugeValue }]
        }]
      });

      // 🔑 Garante ajuste após render
      chart.resize();
    }

    // 🔧 Exemplo (substitua pelo valor real do TagoIO)
    updateGauge(50.9);

    // 📐 Ajuste automático ao redimensionar tela/widget
    window.addEventListener("resize", () => {
      chart.resize();
    });
  </script>
</body>
</html>
