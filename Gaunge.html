<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- ======================================================
       SDK OFICIAL DO CUSTOM WIDGET TAGOIO
       Permite acessar:
       - window.TagoIO.onStart
       - window.TagoIO.onRealtime
       - widget.data
       ====================================================== -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- ======================================================
       APACHE ECHARTS
       Biblioteca responsável pelo Gauge
       ====================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    /* ======================================================
       ESTILO GLOBAL
       ====================================================== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ======================================================
       CONTAINER DO GRÁFICO
       Ocupar todo o espaço do widget
       ====================================================== */
    #chart {
      width: 100%;
      height: 100%;
      min-height: 250px;
    }
  </style>
</head>

<body>

  <!-- ======================================================
       DIV ONDE O GAUGE SERÁ RENDERIZADO
       ====================================================== -->
  <div id="chart"></div>

  <script>
    /* ======================================================
       VARIÁVEL GLOBAL DO GRÁFICO
       Evita recriar o gráfico a cada atualização
       ====================================================== */
    let chart = null;

    /* ======================================================
       CONFIGURAÇÕES DA ESCALA
       ====================================================== */

    const MAX_SCALE = 60;          // 🔴 Escala máxima do instrumento (A)
    const VARIABLE_NAME = "current_ipp1"; // 🔴 Nome da variável no TagoIO

    /* ======================================================
       FUNÇÃO QUE DESENHA / ATUALIZA O GAUGE
       Recebe o valor numérico vindo do TagoIO
       ====================================================== */
    function renderGauge(value) {

      /* --------------------------------------------------
         Inicializa o gráfico apenas uma vez
         -------------------------------------------------- */
      if (!chart) {
        chart = echarts.init(document.getElementById("chart"));
      }

      /* --------------------------------------------------
         Proteção: evita ultrapassar a escala máxima
         -------------------------------------------------- */
      const safeValue = Math.min(value, MAX_SCALE);

      /* --------------------------------------------------
         CONFIGURAÇÃO COMPLETA DO GAUGE
         -------------------------------------------------- */
      chart.setOption({
        series: [
          {
            type: "gauge",

            /* ----------------------------------------------
               FORMATO DO GAUGE (MEIA LUA)
               ---------------------------------------------- */
            startAngle: 180,
            endAngle: 0,

            /* ----------------------------------------------
               ESCALA
               ---------------------------------------------- */
            min: 0,
            max: MAX_SCALE,
            splitNumber: 5, // Ex: 0,12,24,36,48,60

            /* ----------------------------------------------
               LINHA DA ESCALA (ARCO)
               ---------------------------------------------- */
            axisLine: {
              roundCap: true,
              lineStyle: {
                width: 18,
                color: [
                  [0.7, "#4caf50"],  // até 70% → verde
                  [0.9, "#ff9800"],  // até 90% → amarelo
                  [1, "#f44336"]     // acima → vermelho
                ]
              }
            },

            /* ----------------------------------------------
               BARRA DE PROGRESSO
               ---------------------------------------------- */
            progress: {
              show: true,
              roundCap: true,
              width: 18
            },

            /* ----------------------------------------------
               PONTEIRO
               ---------------------------------------------- */
            pointer: {
              length: "70%",
              width: 14,
              offsetCenter: [0, "5%"],
              itemStyle: {
                color: "#f44336"
              }
            },

            /* ----------------------------------------------
               MARCAS PEQUENAS
               ---------------------------------------------- */
            axisTick: {
              distance: -30,
              length: 6,
              lineStyle: {
                color: "#999",
                width: 2
              }
            },

            /* ----------------------------------------------
               MARCAS GRANDES
               ---------------------------------------------- */
            splitLine: {
              distance: -34,
              length: 14,
              lineStyle: {
                color: "#999",
                width: 3
              }
            },

            /* ----------------------------------------------
               NÚMEROS DA ESCALA
               ---------------------------------------------- */
            axisLabel: {
              distance: -48,
              color: "#777",
              fontSize: 14
            },

            /* ----------------------------------------------
               TEXTO CENTRAL (VALOR)
               ---------------------------------------------- */
            detail: {
              valueAnimation: true,
              fontSize: 36,
              fontWeight: "bold",
              color: "#444",
              offsetCenter: [0, "38%"],
              formatter: function (val) {
                return val.toFixed(1) + " A";
              }
            },

            title: { show: false },

            /* ----------------------------------------------
               VALOR QUE MOVE O GAUGE
               ---------------------------------------------- */
            data: [{ value: safeValue }]
          }
        ]
      });

      chart.resize();
    }

    /* ======================================================
       FUNÇÃO QUE PROCESSA OS DADOS DO TAGOIO
       ====================================================== */
    function processData(dataArray) {

      /* --------------------------------------------------
         Filtra apenas a variável desejada
         -------------------------------------------------- */
      const filtered = dataArray
        .filter(item => item.variable === VARIABLE_NAME)
        .sort((a, b) => new Date(b.time) - new Date(a.time));

      /* --------------------------------------------------
         Se não houver dados, não faz nada
         -------------------------------------------------- */
      if (!filtered.length) return;

      /* --------------------------------------------------
         Pega o valor mais recente
         -------------------------------------------------- */
      const latestValue = Number(filtered[0].value);

      renderGauge(latestValue);
    }

    /* ======================================================
       EXECUTA AO CARREGAR O WIDGET
       Usa dados históricos já disponíveis
       ====================================================== */
    window.TagoIO.onStart(widget => {
      processData(widget.data);
    });

    /* ======================================================
       EXECUTA SEMPRE QUE CHEGAR DADO NOVO (REALTIME)
       ====================================================== */
    window.TagoIO.onRealtime(buckets => {

      let allData = [];

      buckets.forEach(bucket => {
        if (bucket.result) {
          allData = allData.concat(bucket.result);
        }
      });

      processData(allData);
    });

    /* ======================================================
       FINALIZA A INICIALIZAÇÃO DO WIDGET
       ====================================================== */
    window.TagoIO.ready();
  </script>

</body>
</html>
