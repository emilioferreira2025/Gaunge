<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #chart {
      width: 100%;
      height: 400px;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

  <script>
    let chart;

    function renderGauge(value) {
      if (!chart) {
        chart = echarts.init(document.getElementById("chart"));
      }

      chart.setOption({
        series: [
          {
            type: 'gauge',
            startAngle: 180,
            endAngle: 0,

            min: 0,
            max: 240,          // ajuste conforme a corrente máxima real
            splitNumber: 12,

            itemStyle: {
              color: '#ff0000',
              shadowColor: 'rgba(255,0,0,0.45)',
              shadowBlur: 10,
              shadowOffsetX: 2,
              shadowOffsetY: 2
            },

            progress: {
              show: true,
              roundCap: true,
              width: 18
            },

            pointer: {
              length: '75%',
              width: 16,
              offsetCenter: [0, '5%']
            },

            axisLine: {
              roundCap: true,
              lineStyle: {
                width: 18
              }
            },

            axisTick: {
              splitNumber: 2,
              lineStyle: {
                width: 2,
                color: '#999'
              }
            },

            splitLine: {
              length: 12,
              lineStyle: {
                width: 3,
                color: '#999'
              }
            },

            axisLabel: {
              distance: 30,
              color: '#999',
              fontSize: 18
            },

            title: {
              show: false
            },

            detail: {
              backgroundColor: '#fff',
              borderColor: '#999',
              borderWidth: 2,
              width: '60%',
              lineHeight: 40,
              height: 40,
              borderRadius: 8,
              offsetCenter: [0, '35%'],
              valueAnimation: true,

              formatter: function (value) {
                return value.toFixed(1) + ' A';
              },

              fontSize: 40,
              color: '#555'
            },

            data: [
              { value: value }
            ]
          }
        ]
      });
    }

    function processData(dataArray) {
      const data = dataArray
        .filter(d => d.variable === "current_ipp1")
        .sort((a, b) => new Date(b.time) - new Date(a.time));

      if (!data.length) return;

      const latestValue = data[0].value;
      renderGauge(latestValue);
    }

    // Carga inicial
    window.TagoIO.onStart(widget => {
      processData(widget.data);
    });

    // Atualização em tempo real
    window.TagoIO.onRealtime(buckets => {
      let allData = [];

      buckets.forEach(bucket => {
        if (bucket.result) {
          allData = allData.concat(bucket.result);
        }
      });

      processData(allData);
    });

    window.TagoIO.ready();
  </script>
</body>
</html>
