<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="chart"></div>

  <script>
    let chart;

    const MAX_SCALE = 60; // escala máxima em Ampère

    function getOption(value) {
      return {
        series: [{
          type: "gauge",

          // ====== AJUSTE AUTOMÁTICO AO TAMANHO ======
          center: ["50%", "75%"],
          radius: "100%",

          startAngle: 180,
          endAngle: 0,

          min: 0,
          max: MAX_SCALE,
          splitNumber: 6,

          axisLine: {
            roundCap: true,
            lineStyle: {
              width: 18,
              color: [
                [0.5, "#43a047"],   // verde
                [0.75, "#fb8c00"],  // laranja
                [1, "#e53935"]      // vermelho
              ]
            }
          },

          pointer: {
            length: "85%",
            width: 12,
            offsetCenter: [0, "-5%"],
            itemStyle: { color: "#ff0000" }
          },

          axisTick: {
            distance: -22,
            length: 6,
            lineStyle: { color: "#ffffff", width: 2 }
          },

          splitLine: {
            distance: -26,
            length: 14,
            lineStyle: { color: "#ffffff", width: 3 }
          },

          axisLabel: {
            distance: -30,
            color: "#ffffff",
            fontSize: 14,
            formatter: value => value.toFixed(0)
          },

          detail: {
            valueAnimation: true,
            fontSize: 34,
            fontWeight: "bold",
            color: "#ffffff",
            offsetCenter: [0, "10%"],
            formatter: v => v.toFixed(1) + " A"
          },

          title: { show: false },

          data: [{ value }]
        }]
      };
    }

    function render(value) {
      if (!chart) {
        chart = echarts.init(document.getElementById("chart"));
      }
      chart.setOption(getOption(value), true);
    }

    // =====================================================
    // SDK TAGOIO – CARGA INICIAL
    // =====================================================
    window.TagoIO.onStart(widget => {
      const data = widget.data
        .filter(d => d.variable === "current_ipp1")
        .sort((a, b) => new Date(b.time) - new Date(a.time));

      if (data.length) {
        render(Number(data[0].value));
      }
    });

    // =====================================================
    // SDK TAGOIO – TEMPO REAL
    // =====================================================
    window.TagoIO.onRealtime(buckets => {
      buckets.forEach(bucket => {
        if (!bucket.result) return;

        bucket.result.forEach(d => {
          if (d.variable === "current_ipp1") {
            render(Number(d.value));
          }
        });
      });
    });

    window.TagoIO.ready();

    // =====================================================
    // RESPONSIVIDADE TOTAL
    // =====================================================
    window.addEventListener("resize", () => {
      if (chart) chart.resize();
    });
  </script>
</body>
</html>
